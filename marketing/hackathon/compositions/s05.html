<template>
  <style>
    @font-face { font-family: "Collapse"; src: url("assets/fonts/Collapse-Bold.woff2") format("woff2"); font-weight: 700; }
    #root { position: absolute; inset: 0; background: #041c1c; overflow: hidden; }
    #s05-view { position: absolute; left: 0; top: 0; width: 1920px; height: 860px; overflow: hidden; background: #031d1c; }
    #s05-cam { position: absolute; left: 0; top: 0; width: 3200px; height: 2000px; transform-origin: 0 0; }
    .s05-shot { position: absolute; left: 0; top: 0; width: 3200px; height: 2000px; }
    #s05-band { position: absolute; left: 0; top: 860px; width: 1920px; height: 220px; background: #041c1c; }
    #s05-kicker { position: absolute; left: 120px; top: 38px; font-family: "JetBrains Mono"; font-weight: 700; font-size: 28px;
      letter-spacing: 0.22em; color: #6e6eff; }
    #s05-line { position: absolute; left: 120px; top: 88px; font-family: "Collapse"; font-weight: 700; font-size: 58px; color: #ffe6cb; }
    .s05-t { color: #3d5a57; }
  </style>
  <div id="root" data-composition-id="s05" data-width="1920" data-height="1080">
    <div id="s05-view">
      <div id="s05-cam">
        <img class="s05-shot" id="s05-live" src="assets/shots/lgtm-live.jpg" alt="The dashboard tab's Live view: turns as they land" />
        <img class="s05-shot" id="s05-metrics" src="assets/shots/lgtm-metrics.jpg" alt="Metrics: tokens by type, calls by model, tool duration" />
        <img class="s05-shot" id="s05-logs" src="assets/shots/lgtm-logs-trace.jpg" alt="Logs for one trace, each line tagged with its trace id" />
      </div>
    </div>
    <div id="s05-band">
      <div id="s05-kicker">BUILT INTO HERMES</div>
      <div id="s05-line"><span class="s05-t" id="s05-t0">Live.</span> <span class="s05-t" id="s05-t1">Metrics.</span> <span class="s05-t" id="s05-t2">Logs.</span> <span class="s05-t" id="s05-t3">No backend required.</span></div>
    </div>
  </div>
  <script>
    (function () {
      const C = /*CUES*/{"dur": 10.899, "lead": 0.45, "sents": [[0.45, 10.299]], "a": {"tab": 0.55, "land": 3.51, "totals": 4.11, "logs": 8.15, "span": 9.2}, "ev": {"tab1": 3.91, "tab2": 7.7, "punch1": 4.46, "punch2": 8.25}}/*END*/;
      const E = C.ev || {}, A = C.a || {};
      const VW = 1920, VH = 860;
      const frame = (x, y, w, h) => {
        const s = Math.min(VW / w, VH / h);
        return { x: (VW - w * s) / 2 - x * s, y: (VH - h * s) / 2 - y * s, scale: s };
      };
      const tabs = frame(520, 140, 1800, 800);       // the tab bar, stat cards and the first turns
      const turns = frame(520, 440, 1900, 640);      // recent turns: model, spans, seconds, tokens
      const tokens = frame(528, 930, 1290, 650);     // Tokens by type + Tool duration
      const logline = frame(520, 330, 1700, 640);    // the trace-id filter and the log lines it selects
      const t1 = E.tab1 ?? 3.9, t2 = E.tab2 ?? 7.7;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s05-cam", tabs, { ...tabs, duration: 0.01 }, 0);
      tl.to("#s05-cam", { ...turns, duration: 1.2, ease: "power2.inOut" }, (A.land ?? 3.5) - 1.6);
      // one stage that rebuilds: each swap is a blur swap; the ground never cuts
      tl.fromTo("#s05-metrics", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.fromTo("#s05-logs", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.to("#s05-cam", { ...tabs, duration: 0.45, ease: "power2.inOut" }, t1 - 0.45);
      tl.to("#s05-live", { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, t1);
      tl.fromTo("#s05-metrics", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out" }, t1 + 0.1);
      tl.to("#s05-cam", { ...tokens, duration: 0.7, ease: "power2.inOut" }, E.punch1 ?? t1 + 0.55);
      tl.to("#s05-cam", { ...tabs, duration: 0.45, ease: "power2.inOut" }, t2 - 0.45);
      tl.to("#s05-metrics", { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, t2);
      tl.fromTo("#s05-logs", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out" }, t2 + 0.1);
      tl.to("#s05-cam", { ...logline, duration: 0.7, ease: "power2.inOut" }, E.punch2 ?? t2 + 0.55);
      tl.fromTo("#s05-kicker", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.2);
      // the caption words go from dim to cream as each view arrives
      [[0, 0.5], [1, t1 + 0.1], [2, t2 + 0.1], [3, (A.span ?? 9.2) - 0.3]].forEach(([i, at]) =>
        tl.fromTo("#s05-t" + i, { color: "#3d5a57" }, { color: "#ffe6cb", duration: 0.12 }, at));
      window.__timelines["s05"] = tl;
    })();
  </script>
</template>
