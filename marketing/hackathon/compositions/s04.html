<template>

  <div id="root" data-composition-id="s04" data-width="1920" data-height="1080">

      <div id="s04-cam" class="s04-cam">

  <script>
    (function () {
      const C = /*CUES*/{"dur": 10.039, "lead": 0.35, "sents": [[0.35, 2.99], [3.07, 7.339]], "w": [{"t": "each", "s": 0.75, "e": 0.83}, {"t": "turn", "s": 1.15, "e": 1.31}, {"t": "becomes", "s": 1.39, "e": 1.55}, {"t": "one", "s": 1.95, "e": 2.03}, {"t": "trace", "s": 2.27, "e": 2.99}, {"t": "every", "s": 3.07, "e": 3.23}, {"t": "model", "s": 3.31, "e": 3.47}, {"t": "call", "s": 3.71, "e": 4.27}, {"t": "tool", "s": 4.27, "e": 4.59}, {"t": "and", "s": 4.51, "e": 4.59}, {"t": "subagent", "s": 4.75, "e": 5.23}, {"t": "nests", "s": 5.31, "e": 5.55}, {"t": "inside", "s": 5.71, "e": 5.95}, {"t": "it", "s": 5.95, "e": 6.03}, {"t": "with", "s": 6.19, "e": 6.27}, {"t": "tokens", "s": 6.43, "e": 6.91}, {"t": "cost", "s": 7.07, "e": 7.31}, {"t": "and", "s": 7.23, "e": 7.31}]}/*END*/;
      const W = C.w || [], D = C.dur || 8;
      const at = (re, n, fb) => { const h = W.filter((w) => re.test(w.t)); return h.length > (n || 0) ? h[n || 0].s : fb; };
      const VW = 1920, VH = 860;
      const frame = (x, y, w, h) => {
        const s = Math.min(VW / w, VH / h);
        return { x: (VW - w * s) / 2 - x * s, y: (VH - h * s) / 2 - y * s, scale: s };
      };
      const all = frame(500, 380, 2700, 1210);        // the whole trace: header + waterfall
      const rows = frame(540, 740, 1800, 840);        // agent + llm + tool rows, legible
      // the opened span: its summary line (model · tokens · finish · latency), panned left to right
      const open0 = frame(540, 980, 1300, 300), open1 = frame(1500, 980, 1300, 300);
      // its attribute list, top (hermes.*, gen_ai.*) to bottom (llm.*, openinference.*)
      const attr0 = frame(540, 150, 1500, 660), attr1 = frame(540, 1170, 1500, 660);
      // One camera per shot, each set once and moved by ONE tween, so a seek to any time (in any
      // order) lands on the same frame: no tween ever starts from another tween's leftovers.
      gsap.set("#s04-cam", { ...all });
      gsap.set("#s04-cam2", { ...rows });
      gsap.set("#s04-cam3", { ...attr0 });
      const tl = gsap.timeline({ paused: true });
      // the engraving dissolves into the real screen as "trace" is said
      const tr = at(/trace/, 0, 1.0);
      tl.fromTo("#s04-print", { opacity: 1 }, { opacity: 0, duration: 0.7, ease: "power2.inOut" }, tr);
      const nest = at(/nests?/, 0, 4), tok = at(/tokens?/, 0, 5.5);
      tl.to("#s04-cam", { ...rows, duration: 1.1, ease: "power2.inOut" }, at(/model/, 0, 2.6) - 0.3);
      // "with tokens, cost and timing": the first model call is clicked open, then its summary
      // line (model · tokens · finish · latency) is read left to right
      const vEnd = C.sents[C.sents.length - 1][1], op = tok - 0.7;
      tl.fromTo("#s04-ring", { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 0.2, ease: "expo.out" }, op - 0.35);
      tl.to("#s04-ring", { opacity: 0, duration: 0.15 }, op + 0.1);
      tl.to("#s04-cam2", { opacity: 1, duration: 0.15, ease: "power2.out" }, op);
      tl.to("#s04-cam2", { keyframes: [
        { ...open0, duration: 0.8, ease: "power2.inOut" },
        { ...open1, duration: Math.max(0.8, vEnd - op - 0.9), ease: "power1.inOut", delay: 0.1 },
      ] }, op + 0.001);
      // after the voice: every attribute on that span, scrolled top to bottom
      const a0 = vEnd + 0.15;
      tl.to("#s04-cam3", { opacity: 1, duration: 0.2, ease: "power2.out" }, a0);
      tl.to("#s04-cam3", { ...attr1, duration: D - a0 - 0.25, ease: "power1.inOut" }, a0 + 0.001);
      tl.to("#s04-line", { opacity: 0, duration: 0.15 }, a0 - 0.1);
      tl.fromTo("#s04-line2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, a0 + 0.05);
      const ws = document.querySelectorAll(".s04-w");
      [nest, tok, tok + 0.5].forEach((t, i) => tl.fromTo(ws[i], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25, ease: "expo.out" }, t));
      window.__timelines["s04"] = tl;
    })();
  </script>
