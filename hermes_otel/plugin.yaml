name: hermes_otel
version: 1.28.0
manifest_version: 2
description: >-
  OpenTelemetry for Hermes Agent: sessions, LLM and API calls, tool calls,
  sub-agents and approvals as OTLP traces, metrics and logs to any OTLP backend.
  Disclosure — sends span data including prompts, tool arguments and tool output
  only to backends you configure (a backends: list or an OTEL_* variable); by
  default content_capture is full and unclipped (preview clips to 1200 chars,
  off sends none); vendor SDK keys already in the environment are used only
  after that opt-in; with nothing configured it keeps a local owner-only SQLite
  store under $HERMES_HOME and sends nothing; installs opentelemetry-api, -sdk,
  -exporter-otlp-proto-http (>=1.35,<2) and PyYAML.
author: Brian Caffey
license: Apache-2.0
homepage: https://briancaffey.github.io/hermes-otel/
tags:
  - observability
  - opentelemetry
  - tracing
  - metrics
  - logs
requires_hermes: '>=0.21'
python_dependencies:
  - opentelemetry-api>=1.35,<2
  - opentelemetry-sdk>=1.35,<2
  - opentelemetry-exporter-otlp-proto-http>=1.35,<2
  - PyYAML>=6,<7
provides_hooks:
  - on_session_start
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - post_llm_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_auxiliary_call
  - post_auxiliary_call
  - subagent_start
  - subagent_stop
  - pre_approval_request
  - post_approval_response
  - transform_terminal_output
  - transform_llm_output
  - kanban_task_claimed
  - kanban_task_completed
  - kanban_task_blocked
  - on_kanban_worker_spawned
  - on_kanban_worker_exited
  - on_kanban_worker_stale_claim
  - on_kanban_dispatch_tick
  - agent_loop_stopped
  - pre_verify
  - pre_command
  - on_human_input_request
  - on_human_input_resolved
  - on_skill_lifecycle
  - pre_transcription
  - on_kanban_task_updated
