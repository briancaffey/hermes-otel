name: hermes_otel
version: 1.11.0
manifest_version: 2
description: >-
  OpenTelemetry for Hermes Agent: sessions, LLM and API calls, tool calls,
  sub-agents and approvals as OTLP traces, metrics and logs to any OTLP backend.
  Disclosure — sends span data, including prompts, tool arguments and tool
  output, only to the backends you configure; by default (content_capture: full)
  whole prompts and responses, unclipped; preview clips to 1200 chars, off sends
  no content; with none configured it keeps a local SQLite store under
  $HERMES_HOME and sends nothing; installs opentelemetry-api, opentelemetry-sdk
  and opentelemetry-exporter-otlp-proto-http into the Hermes venv.
author: Brian Caffey
license: Apache-2.0
homepage: https://briancaffey.github.io/hermes-otel/
tags:
  - observability
  - opentelemetry
  - tracing
  - metrics
  - logs
requires_hermes: '>=0.21'
python_dependencies:
  - opentelemetry-api<2
  - opentelemetry-sdk<2
  - opentelemetry-exporter-otlp-proto-http<2
provides_hooks:
  - on_session_start
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - post_llm_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - subagent_start
  - subagent_stop
  - pre_approval_request
  - post_approval_response
