name: hermes_otel
version: 1.6.1
description: >-
  OpenTelemetry integration - automatically export traces to OTLP endpoints
  (Phoenix, Langfuse, LangSmith, etc.)
python_dependencies:
  - opentelemetry-api<2
  - opentelemetry-sdk<2
  - opentelemetry-exporter-otlp-proto-http<2
provides_hooks:
  - on_session_start
  - on_session_end
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - post_llm_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - subagent_start
  - subagent_stop
  - pre_approval_request
  - post_approval_response
