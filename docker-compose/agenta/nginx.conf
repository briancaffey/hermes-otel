# Agenta's hosting/docker-compose/oss/nginx/nginx.conf (tag 4bc5190, 2026-10-11),
# reduced to the two upstreams this folder runs: the API under /api/ and the web
# UI at /. The mobile UI (/m), the playground services (/services/*) and the
# rate-limit zone are dropped with the containers that served them.

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=30s;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    server {
        listen 80;
        server_name localhost;

        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;

        # OTLP batches are protobuf; the plugin caps a batch well under this.
        client_max_body_size 32m;

        location /api/ {
            proxy_pass http://api:8000/;
            proxy_set_header "Host" $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location / {
            proxy_pass http://web:3000;
            proxy_set_header "Host" $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://api:8000/health;
            access_log off;
        }
    }
}
