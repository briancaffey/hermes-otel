# Agenta (OSS) — an open-source LLMOps platform with native OTLP trace ingest.
#
# Trimmed from upstream's hosting/docker-compose/oss/docker-compose.gh.yml
# (github.com/Agenta-AI/agenta, MIT outside ee/, tag 4bc5190 on 2026-10-11) to
# what trace ingest and the UI need, eleven containers:
#
#   postgres, redis-volatile, redis-durable, seaweedfs (the object store the
#   API insists on), alembic (one-shot migrations), supertokens (sign-in),
#   api (REST + OTLP ingest), worker-streams (persists the ingested spans
#   from a Redis stream), worker-queues, web (UI), nginx (one front door)
#
# Dropped from upstream: runner (sandboxes; needs SYS_ADMIN + /dev/fuse),
# services (playground), cron, web-mobile, composio, and Traefik (mounts the
# Docker socket) in favour of the nginx profile. The upstream .env values are
# inlined below; the secrets are local defaults. PostHog telemetry is off.
#
# Usage:
#   docker compose -f docker-compose/agenta/docker-compose.yaml up -d     # ~1-2 min
#   export OTEL_AGENTA_API_KEY="$(docker-compose/agenta/mint-api-key.sh)"
#   # UI:  http://localhost:3060   (sign-ups are open; the script creates one)
#   docker compose -f docker-compose/agenta/docker-compose.yaml down -v
#
# Ports (host side; override with the env vars):
#   3060  nginx: web UI at /, API at /api/, OTLP at /api/otlp/v1/traces   AGENTA_PORT
#   Postgres, Redis and SeaweedFS stay inside the compose network.
#
# Point the plugin at it:
#
#   backends:
#     - type: agenta
#       endpoint: http://localhost:3060
#       api_key_env: OTEL_AGENTA_API_KEY
#
# Details and caveats: README.md in this folder; directory manual: docker-compose/README.md.

x-agenta-env: &agenta-env
  AGENTA_LICENSE: oss
  AGENTA_WEB_URL: http://localhost:${AGENTA_PORT:-3060}
  AGENTA_API_URL: http://localhost:${AGENTA_PORT:-3060}/api
  AGENTA_SERVICES_URL: http://localhost:${AGENTA_PORT:-3060}/services
  AGENTA_AUTH_KEY: ${AGENTA_AUTH_KEY:-hermes-otel-local-auth-key}
  AGENTA_SERVICES_INTERNAL_KEY: ${AGENTA_SERVICES_INTERNAL_KEY:-hermes-otel-local-internal-key}
  AGENTA_CRYPT_KEY: ${AGENTA_CRYPT_KEY:-hermes-otel-local-crypt-key}
  AGENTA_RUNNER_TOKEN: ${AGENTA_RUNNER_TOKEN:-hermes-otel-local-runner-token}
  AGENTA_INSECURE_EGRESS_ALLOWED: "false"
  AGENTA_MCP_GATEWAY_ENABLED: "false"
  AGENTA_LLM_GATEWAY_ENABLED: "false"
  AGENTA_GATEWAYS_INSECURE_EGRESS_ALLOWED: "true"
  AGENTA_GATEWAYS_INSECURE_HTTP_ALLOWED: "true"
  # Upstream ships a PostHog key here (anonymous usage telemetry); empty = off.
  POSTHOG_API_KEY: ""
  AGENTA_STORE_ACCESS_KEY: ${AGENTA_STORE_ACCESS_KEY:-hermes-otel-store-access}
  AGENTA_STORE_SECRET_KEY: ${AGENTA_STORE_SECRET_KEY:-hermes-otel-store-secret-key}
  AGENTA_STORE_ENDPOINT_URL: http://seaweedfs:8333
  AGENTA_STORE_BUCKET: agenta-store
  AGENTA_STORE_SIGNING_KEY: ${AGENTA_STORE_SIGNING_KEY:-hermes-otel-store-signing-key}
  AGENTA_STORE_REGION: us-east-1
  DOCKER_NETWORK_MODE: bridge
  AGENTA_RUNNER_INTERNAL_URL: http://runner:8765
  POSTGRES_URI_SUPERTOKENS: postgresql://username:password@postgres:5432/agenta_oss_supertokens

services:
  postgres:
    image: postgres:17
    container_name: hermes-otel-agenta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    volumes:
      - agenta_postgres:/var/lib/postgresql/data/
      - ./init-db-oss.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d agenta_oss_core"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-volatile:
    image: redis:8
    container_name: hermes-otel-agenta-redis-volatile
    restart: unless-stopped
    command: redis-server --appendonly no --save "" --maxmemory 512mb --maxmemory-policy volatile-lru --port 6379
    volumes:
      - agenta_redis_volatile:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis-durable:
    image: redis:8
    container_name: hermes-otel-agenta-redis-durable
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync no --aof-load-corrupt-tail-max-size 1048576 --save "" --maxmemory 512mb --maxmemory-policy noeviction --port 6381
    volumes:
      - agenta_redis_durable:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: hermes-otel-agenta-seaweedfs
    restart: unless-stopped
    environment:
      AGENTA_STORE_ACCESS_KEY: ${AGENTA_STORE_ACCESS_KEY:-hermes-otel-store-access}
      AGENTA_STORE_SECRET_KEY: ${AGENTA_STORE_SECRET_KEY:-hermes-otel-store-secret-key}
      AGENTA_STORE_BUCKET: agenta-store
      AGENTA_STORE_SIGNING_KEY: ${AGENTA_STORE_SIGNING_KEY:-hermes-otel-store-signing-key}
      AGENTA_STORE_JWT_ISSUER: http://api:8000
    # Upstream's entrypoint with one change: the S3 identity and IAM files it
    # renders from the env go under the data volume (/data/config) instead of
    # /etc/seaweedfs, then one weed server starts with the S3 gateway.
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /data/config
        cat > /data/config/s3.json <<EOF2
        {"identities":[{"name":"agenta","credentials":[{"accessKey":"$${AGENTA_STORE_ACCESS_KEY}","secretKey":"$${AGENTA_STORE_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF2
        cat > /data/config/iam.json <<EOF2
        {"sts":{"tokenDuration":"1h","maxSessionLength":"12h","issuer":"seaweedfs-sts","signingKey":"$${AGENTA_STORE_SIGNING_KEY}"},"providers":[{"name":"agenta","type":"oidc","enabled":true,"config":{"issuer":"$${AGENTA_STORE_JWT_ISSUER}","clientId":"agenta-store","jwksUri":"$${AGENTA_STORE_JWT_ISSUER}/.well-known/jwks.json"}}],"policies":[{"name":"store-rw","document":{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::$${AGENTA_STORE_BUCKET}","arn:aws:s3:::$${AGENTA_STORE_BUCKET}/*"]}]}}],"roles":[{"roleName":"agenta-store","roleArn":"arn:aws:iam::role/agenta-store","attachedPolicies":["store-rw"],"trustPolicy":{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"agenta"},"Action":["sts:AssumeRoleWithWebIdentity"]}]}}]}
        EOF2
        exec weed server -dir=/data -ip=seaweedfs -volume.max=64 -s3 -s3.port=8333 -s3.config=/data/config/s3.json -s3.iam.config=/data/config/iam.json
    volumes:
      - agenta_seaweed:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9333/cluster/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  alembic:
    image: ghcr.io/agenta-ai/agenta-api:${AGENTA_VERSION:-latest}
    container_name: hermes-otel-agenta-alembic
    command: sh -c "python -m oss.databases.postgres.migrations.runner"
    environment:
      <<: *agenta-env
    depends_on:
      postgres:
        condition: service_healthy

  supertokens:
    image: supertokens/supertokens-postgresql:11
    container_name: hermes-otel-agenta-supertokens
    restart: unless-stopped
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://username:password@postgres:5432/agenta_oss_supertokens
    depends_on:
      postgres:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e \"GET /hello HTTP/1.1\\r\\nhost: 127.0.0.1:3567\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep Hello'"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/agenta-ai/agenta-api:${AGENTA_VERSION:-latest}
    container_name: hermes-otel-agenta-api
    restart: unless-stopped
    command: >
      gunicorn entrypoints.routers:app
      --bind ${AGENTA_BIND_HOST:-0.0.0.0}:8000
      --worker-class entrypoints.uvicorn_worker.DrainingUvicornWorker
      --workers 2 --worker-connections 1000 --backlog 2048 --keep-alive 5
      --max-requests 100000 --max-requests-jitter 10000 --timeout 60 --graceful-timeout 900
      --log-level info --access-logfile - --error-logfile -
    environment:
      <<: *agenta-env
      SCRIPT_NAME: /api
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
      redis-volatile:
        condition: service_healthy
      redis-durable:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  worker-streams:
    image: ghcr.io/agenta-ai/agenta-api:${AGENTA_VERSION:-latest}
    container_name: hermes-otel-agenta-worker-streams
    restart: unless-stopped
    command: ["python", "-m", "entrypoints.worker_streams"]
    environment:
      <<: *agenta-env
      AGENTA_WORKER_STREAMS: ""
    depends_on:
      postgres:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
      redis-volatile:
        condition: service_healthy
      redis-durable:
        condition: service_healthy

  worker-queues:
    image: ghcr.io/agenta-ai/agenta-api:${AGENTA_VERSION:-latest}
    container_name: hermes-otel-agenta-worker-queues
    restart: unless-stopped
    command: ["python", "-m", "entrypoints.worker_queues"]
    environment:
      <<: *agenta-env
      AGENTA_WORKER_QUEUES: ""
    depends_on:
      postgres:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
      redis-volatile:
        condition: service_healthy
      redis-durable:
        condition: service_healthy

  web:
    image: ghcr.io/agenta-ai/agenta-web:${AGENTA_VERSION:-latest}
    container_name: hermes-otel-agenta-web
    restart: unless-stopped
    command: sh -c "node ./oss/server.js"
    environment:
      <<: *agenta-env

  nginx:
    image: nginx:1
    container_name: hermes-otel-agenta
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${AGENTA_PORT:-3060}:80"
    depends_on:
      - api
      - web

volumes:
  agenta_postgres:
  agenta_redis_volatile:
  agenta_redis_durable:
  agenta_seaweed:
