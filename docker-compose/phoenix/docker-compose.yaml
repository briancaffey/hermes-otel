# Arize Phoenix — OpenInference trace UI (traces only).
#
# Usage:
#   docker compose -f docker-compose/phoenix/docker-compose.yaml up -d
#   # UI:  http://localhost:6006   (no login)
#   docker compose -f docker-compose/phoenix/docker-compose.yaml down
#
# Ports:
#   6006  Phoenix UI + OTLP/HTTP (/v1/traces)   ← plugin exports here
#
# Point the plugin at it:
#
#   backends:
#     - type: phoenix
#       endpoint: http://localhost:6006/v1/traces
#
# Details and caveats: README.md in this folder.

services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: hermes-otel-phoenix
    environment:
      # Phoenix 21 turns auth on whenever it binds a non-loopback address
      # (which it must inside a container); without this, OTLP writes get 401.
      # Local development stack only.
      PHOENIX_ENABLE_AUTH: "false"
    ports:
      - "6006:6006"  # UI and OTLP HTTP collector
      # 4317 (gRPC) intentionally omitted so Phoenix can coexist with other
      # OTLP collectors (Jaeger, Tempo) on the same host. The plugin talks
      # to Phoenix over HTTP at :6006/v1/traces.
