receivers:
  otlp:
    protocols:
      # Bind ${env:OTEL_BIND_HOST} (set to 0.0.0.0 in the compose service) so
      # the ports published by Docker are reachable; override OTEL_BIND_HOST to
      # bind a single interface instead.
      http: {endpoint: "${env:OTEL_BIND_HOST}:4318"}

processors:
  batch: {}

exporters:
  elasticsearch:
    endpoint: ${env:ES_ENDPOINT}
    mapping: {mode: otel}
    # Plain HTTP, no TLS/auth — the compose stack runs ES with security off.
    insecure: true
    insecure_skip_verify: true
    # A single cold node takes a while to create the index templates and
    # data streams on the first bulk request, and a busy laptop can stall it
    # for seconds at a time. With the defaults the exporter gives up
    # ("bulk indexer flush error: context deadline exceeded") and drops the
    # batch; keep trying instead.
    timeout: 90s
    retry:
      enabled: true
      max_retries: 10
      initial_interval: 2s
      max_interval: 30s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000

service:
  pipelines:
    traces: {receivers: [otlp], processors: [batch], exporters: [elasticsearch]}
    metrics: {receivers: [otlp], processors: [batch], exporters: [elasticsearch]}
    logs: {receivers: [otlp], processors: [batch], exporters: [elasticsearch]}
