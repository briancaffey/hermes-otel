name: release-please

# Requires repository secret GH_PAT — a fine-grained or classic personal
# access token with `contents: write` and `pull-requests: write` on this
# repo. A PAT is used (rather than GITHUB_TOKEN) so the release PR opened
# by this workflow triggers downstream workflows (CI) on its own push —
# GITHUB_TOKEN-originated events are silenced by GitHub's loop-protection.

on:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GH_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps pyproject.toml but never uv.lock (which records the
      # package's own version), so `uv lock --check` in CI failed on every
      # release PR; and it only rebases the release branch when the release
      # notes change, so ci:/test:/chore: commits on main left the PR's checks
      # stale. Keep the release branch current on every push to main (#124).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ steps.release.outputs.pr }}
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        if: ${{ steps.release.outputs.pr }}
      - name: Keep the release PR current (merge main, refresh uv.lock)
        if: ${{ steps.release.outputs.pr }}
        env:
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          branch=$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["headBranchName"])')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          # Bring in everything on main the bot did not rebase onto.
          git merge --no-edit origin/main
          uv lock
          if ! git diff --quiet -- uv.lock; then
            git add uv.lock
            git commit -m "chore(release): refresh uv.lock"
          fi
          git push origin "$branch"

      # Every release needs a sha-bump PR in the Hermes plugin catalog
      # (plugin-catalog/hermes-otel.yaml in NousResearch/hermes-agent) that
      # updates `sha` and `version` together. Render that file from the
      # released commit, attach it to the GitHub release and print it in the
      # job summary so the upstream PR is a file copy (#133).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: ${{ steps.release.outputs.sha }}
      - name: Render the plugin-catalog entry for this release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TAG: ${{ steps.release.outputs.tag_name }}
          SHA: ${{ steps.release.outputs.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python scripts/render_catalog_entry.py --sha "$SHA" --version "$VERSION" -o hermes-otel.yaml
          gh release upload "$TAG" hermes-otel.yaml --clobber
          {
            echo "## plugin-catalog/hermes-otel.yaml for $TAG"
            echo
            echo 'Copy this file into a sha-bump PR against NousResearch/hermes-agent.'
            echo
            echo '```yaml'
            cat hermes-otel.yaml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
