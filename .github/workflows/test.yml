name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true
      - name: Lockfile is up to date
        run: uv lock --check
      - name: Ruff check
        run: uv run --extra dev ruff check .
      - name: Black format check
        run: uv run --extra dev black --check .

  plugin-scan:
    # Hermes scans a plugin's file tree before install; one `critical` finding
    # is an unoverridable block (issue #53). Run that exact scanner here so a
    # regression is a red build, not a user who cannot install the plugin.
    name: Plugin security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Scan install artifact and repository
        run: python scripts/scan_plugin_artifact.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the declared floor (requires-python); 3.13 the newest. The
        # full suite passes on 3.9, 3.10, 3.11 and 3.13 locally.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit and integration tests with coverage
        # --python pins uv to the matrix interpreter (otherwise it may pick a
        # managed one and silently test a different version).
        run: >
          uv run --python ${{ matrix.python-version }} --extra dev pytest
          --tb=short -q
          --cov=hermes_otel
          --cov-report=term
          --cov-report=xml
          --cov-fail-under=85

      - name: Upload coverage artifact
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  dashboard-dist:
    # hermes_otel/dashboard/dist/ is committed build output of dashboard-ui/src.
    # Rebuild it and fail if a PR changed the TSX without rebuilding (#100).
    name: Dashboard bundle is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard-ui/package-lock.json
      - name: Build
        run: cd dashboard-ui && npm ci && npm run build
      - name: Fail on a stale bundle
        run: git diff --exit-code -- hermes_otel/dashboard/dist
      - name: Front-end unit tests (src/lib.ts)
        run: cd dashboard-ui && npm test

  website-build:
    # deploy-site.yml only builds on push to main; catch a broken docs build
    # (or a broken link — onBrokenLinks: throw) on the PR instead (#103).
    name: Docs site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build
        run: cd website && npm ci && npm run build

  package:
    # The setuptools metadata (package-data globs, entry point) is otherwise
    # never exercised; build the wheel and check the artifact files are in it.
    name: Wheel builds and contains the plugin files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      - name: Build
        run: uv build
      - name: Check wheel contents
        run: |
          set -e
          listing=$(unzip -l dist/*.whl)
          for f in hermes_otel/plugin.yaml hermes_otel/dashboard/dist/index.js hermes_otel/skills/observability/SKILL.md hermes_otel/hooks/__init__.py hermes_otel/hooks/tools.py; do
            echo "$listing" | grep -q "$f" || { echo "missing from wheel: $f"; exit 1; }
          done

  catalog-admission:
    # The Hermes plugin catalog gates admission, and every later sha bump, on
    # `hermes plugins validate --install-deps` at the pinned commit, a
    # structural check of the entry and a grep for self-updating code
    # (NousResearch/hermes-agent .github/workflows/plugin-catalog-ci.yml).
    # Run the same gates here against the latest Hermes release so a red
    # admission check never shows up first in the upstream PR (#133).
    name: Catalog admission checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HERMES_HOME: ${{ github.workspace }}/.hermes-home
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          # hermes-agent requires >=3.11,<3.14
          python-version: "3.11"
      - name: Install Hermes Agent from main (what the upstream catalog CI installs)
        # Upstream runs `pip install -e .` on its own checkout, i.e. hermes-agent
        # main, so the gate is main's validator (`--install-deps` is newer than
        # the latest tag). The sha is logged for the record.
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch main https://github.com/NousResearch/hermes-agent "$RUNNER_TEMP/hermes-agent"
          echo "hermes-agent main @ $(git -C "$RUNNER_TEMP/hermes-agent" rev-parse --short HEAD)"
          pip install --quiet -e "$RUNNER_TEMP/hermes-agent" pyyaml
          mkdir -p "$HERMES_HOME"
          hermes --version
      - name: hermes plugins validate --install-deps (the catalog gate)
        run: hermes plugins validate --install-deps ./hermes_otel
      - name: hermes plugins doctor --ci
        run: hermes plugins doctor ./hermes_otel --ci
      - name: Render the catalog entry and run the upstream structural validator
        run: |
          set -euo pipefail
          python scripts/render_catalog_entry.py --sha "$GITHUB_SHA" -o "$RUNNER_TEMP/plugin-catalog/hermes-otel.yaml"
          cat "$RUNNER_TEMP/plugin-catalog/hermes-otel.yaml"
          python "$RUNNER_TEMP/hermes-agent/scripts/validate_plugin_catalog.py" "$RUNNER_TEMP/plugin-catalog/hermes-otel.yaml"
      - name: No self-updating code in the install artifact (catalog rule 3)
        run: |
          set -euo pipefail
          hits=$(grep -rlE 'releases/latest|raw\.githubusercontent\.com' \
              --include='*.js' --include='*.mjs' --include='*.cjs' --include='*.ts' hermes_otel \
            | xargs -r grep -lE 'writeTextFile|renamePath|writeFile\(' || true)
          if [ -n "$hits" ]; then
            echo "self-updating code in the install artifact: $hits"; exit 1
          fi
          echo "no self-updater patterns"
