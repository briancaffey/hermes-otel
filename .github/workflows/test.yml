name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets: a PR stacked on another PR's
  # branch gets the same checks as one against main.
  pull_request:

# A push that supersedes an in-flight run on the same branch cancels it: the
# old run's verdict is about a commit nobody will merge, and on the
# release-please branch the bot's "refresh uv.lock" follow-up otherwise
# leaves one guaranteed red run behind (#208).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true
      - name: Lockfile is up to date
        run: uv lock --check
      - name: Ruff check
        run: uv run --extra dev ruff check .
      - name: Black format check
        run: uv run --extra dev black --check .

  plugin-scan:
    # Hermes scans a plugin's file tree before install; one `critical` finding
    # is an unoverridable block (issue #53). Run that exact scanner here so a
    # regression is a red build, not a user who cannot install the plugin.
    name: Plugin security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .cache/hermes-scanner
          key: hermes-scanner-${{ hashFiles('scripts/hermes_scanner.lock.json') }}
      - name: Scan install artifact and repository
        env:
          HERMES_SCANNER_CACHE_DIR: ${{ github.workspace }}/.cache/hermes-scanner
        run: python scripts/scan_plugin_artifact.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the declared floor (requires-python); 3.13 the newest. The
        # full suite passes on 3.9, 3.10, 3.11 and 3.13 locally.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit and integration tests with coverage
        # --python pins uv to the matrix interpreter (otherwise it may pick a
        # managed one and silently test a different version).
        run: >
          uv run --python ${{ matrix.python-version }} --extra dev pytest
          --tb=short -q
          --cov=hermes_otel
          --cov-branch
          --cov-report=term
          --cov-report=xml
          --cov-report=json
          --cov-fail-under=85

      - name: Per-module coverage floors (coverage-floors.json, #412)
        if: matrix.python-version == '3.13'
        run: uv run --python 3.13 python scripts/coverage_floor.py

      - name: Upload coverage artifact
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  test-otel-floor:
    # The declared OpenTelemetry floor (``>=1.35`` in pyproject.toml,
    # hermes_otel/requirements.txt and plugin.yaml) is a measured value, and
    # this job is what keeps it true: a fresh venv with the three packages
    # pinned to exactly the floor, then the full suite. Bump all four places
    # together when the plugin starts needing a newer SDK API (#257).
    name: Tests on the OpenTelemetry floor (1.35)
    runs-on: ubuntu-latest
    env:
      OTEL_FLOOR: "1.35.0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install the project with the OTel packages pinned to the floor
        run: >
          uv venv --python 3.11 .venv-floor &&
          uv pip install --python .venv-floor/bin/python -e ".[dev]"
          "opentelemetry-api==$OTEL_FLOOR"
          "opentelemetry-sdk==$OTEL_FLOOR"
          "opentelemetry-exporter-otlp-proto-http==$OTEL_FLOOR"
      - name: Confirm the floor is what runs
        run: >
          .venv-floor/bin/python -c
          "import sys, opentelemetry.sdk.version as v; assert v.__version__ == sys.argv[1], v.__version__; print('opentelemetry-sdk', v.__version__)"
          "$OTEL_FLOOR"
      - name: Run unit and integration tests on the floor
        run: .venv-floor/bin/python -m pytest --tb=short -q

  dashboard-dist:
    # hermes_otel/dashboard/dist/ is committed build output of dashboard-ui/src.
    # Rebuild it and fail if a PR changed the TSX without rebuilding (#100).
    name: Dashboard bundle is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard-ui/package-lock.json
      - name: Build
        run: cd dashboard-ui && npm ci && npm run build
      - name: Fail on a stale bundle
        run: git diff --exit-code -- hermes_otel/dashboard/dist
      - name: Type check, lint, format (tsc, eslint, prettier)
        run: cd dashboard-ui && npm run check
      - name: Front-end unit tests (pure helpers + rendered page smoke tests)
        run: cd dashboard-ui && npm test

  website-build:
    # deploy-site.yml only builds on push to main; catch a broken docs build
    # (or a broken link — onBrokenLinks: throw) on the PR instead (#103).
    name: Docs site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build
        run: cd website && npm ci && npm run build

  package:
    # The setuptools metadata (package-data globs, entry point) is otherwise
    # never exercised; build the wheel and check the artifact files are in it.
    name: Wheel builds and contains the plugin files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      - name: Build
        run: uv build
      - name: Check wheel contents
        run: |
          set -e
          listing=$(unzip -l dist/*.whl)
          for f in hermes_otel/plugin.yaml hermes_otel/dashboard/dist/index.js hermes_otel/skills/observability/SKILL.md hermes_otel/hooks/__init__.py hermes_otel/hooks/tools.py; do
            echo "$listing" | grep -q "$f" || { echo "missing from wheel: $f"; exit 1; }
          done
